<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff — Crea sin Miedo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --dark:#06090f; --orange:#f97316; --gold:#fbbf24; --green:#22c55e;
      --red:#ef4444; --blue:#3b82f6; --purple:#8b5cf6;
      --white:#ffffff; --text:#c8cfe0; --muted:#6a7590; --card:rgba(255,255,255,.04);
    }
    body { background:var(--dark); color:var(--white); font-family:'Inter',sans-serif; min-height:100vh; }

    /* Gate */
    #gate { position:fixed; inset:0; z-index:999; background:var(--dark); display:flex; align-items:center; justify-content:center; }
    .gate-card { background:rgba(255,255,255,.04); border:1px solid rgba(249,115,22,.2); border-radius:16px; padding:32px; width:320px; text-align:center; }
    .gate-card h2 { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; margin-bottom:6px; }
    .gate-card p { font-size:.8rem; color:var(--muted); margin-bottom:20px; }
    .gate-card input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:12px; color:var(--white); font-size:1rem; outline:none; text-align:center; margin-bottom:10px; }
    .gate-btn { width:100%; background:var(--orange); color:#000; border:none; border-radius:8px; padding:12px; font-weight:800; font-size:.88rem; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
    .gate-err { font-size:.75rem; color:var(--red); margin-top:8px; display:none; }

    header { background:rgba(10,15,26,.98); border-bottom:1px solid rgba(249,115,22,.12); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .h-logo { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:.06em; }
    .h-logo span { color:var(--orange); }
    .h-date { font-size:.75rem; color:var(--muted); }

    .content { max-width:1100px; margin:0 auto; padding:24px; }

    /* Tabs */
    .tabs { display:flex; gap:0; background:rgba(255,255,255,.04); border-radius:10px; padding:4px; margin-bottom:24px; border:1px solid rgba(255,255,255,.07); overflow-x:auto; }
    .tab { flex:1; min-width:max-content; padding:10px 16px; text-align:center; border-radius:7px; font-size:.82rem; font-weight:600; cursor:pointer; transition:background .2s, color .2s; color:var(--muted); white-space:nowrap; }
    .tab.active { background:var(--orange); color:#000; }

    /* Cronograma */
    .timeline { display:flex; flex-direction:column; gap:0; }
    .tl-item { display:grid; grid-template-columns:80px 1fr; gap:0; }
    .tl-time { padding:16px 16px 16px 0; text-align:right; }
    .tl-time span { font-family:'Bebas Neue',sans-serif; font-size:1rem; color:var(--orange); white-space:nowrap; }
    .tl-body { border-left:2px solid rgba(249,115,22,.2); padding:16px 16px 16px 20px; position:relative; }
    .tl-body::before { content:''; position:absolute; left:-5px; top:22px; width:8px; height:8px; border-radius:50%; background:var(--orange); }
    .tl-item.staff .tl-body::before { background:var(--blue); }
    .tl-item.staff .tl-time span { color:var(--blue); }
    .tl-item.break .tl-body::before { background:var(--muted); }
    .tl-item.break .tl-time span { color:var(--muted); }
    .tl-card { background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:14px 16px; }
    .tl-card.staff-card { border-left:3px solid var(--blue); }
    .tl-card.break-card { border-left:3px solid rgba(255,255,255,.1); opacity:.7; }
    .tl-card h4 { font-size:.9rem; font-weight:700; margin-bottom:4px; }
    .tl-card p { font-size:.78rem; color:var(--muted); line-height:1.6; }
    .tl-card .tl-meta { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
    .tl-tag { background:rgba(255,255,255,.07); border-radius:20px; padding:2px 10px; font-size:.68rem; color:var(--text); }
    .tl-tag.orange { background:rgba(249,115,22,.12); color:var(--orange); }
    .tl-tag.blue { background:rgba(59,130,246,.12); color:var(--blue); }
    .tl-tag.green { background:rgba(34,197,94,.12); color:var(--green); }

    /* Staff list */
    .staff-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
    .staff-card { background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:20px; }
    .staff-avatar { width:48px; height:48px; border-radius:50%; background:rgba(249,115,22,.15); border:2px solid rgba(249,115,22,.2); display:flex; align-items:center; justify-content:center; font-size:1.3rem; margin-bottom:12px; }
    .staff-name { font-weight:800; font-size:.95rem; margin-bottom:2px; }
    .staff-rol { font-size:.75rem; color:var(--orange); margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
    .staff-area { display:inline-block; background:rgba(255,255,255,.07); border-radius:20px; padding:2px 10px; font-size:.7rem; color:var(--text); margin-bottom:10px; }
    .staff-horario { font-size:.8rem; color:var(--muted); }
    .staff-tareas { margin-top:12px; border-top:1px solid rgba(255,255,255,.06); padding-top:12px; }
    .staff-tareas h5 { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .tarea { display:flex; gap:8px; align-items:flex-start; margin-bottom:6px; }
    .tarea-check { width:16px; height:16px; border-radius:4px; border:1.5px solid rgba(255,255,255,.2); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, border-color .2s; }
    .tarea-check.done { background:var(--green); border-color:var(--green); }
    .tarea-check.done::after { content:'✓'; font-size:.6rem; color:#000; font-weight:900; }
    .tarea-text { font-size:.78rem; color:var(--text); line-height:1.5; }
    .tarea.done .tarea-text { text-decoration:line-through; color:var(--muted); }

    /* Notas de producción */
    .notas-card { background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:24px; white-space:pre-wrap; font-size:.85rem; color:var(--text); line-height:1.7; }

    #app { display:none; }
    .section { display:none; }
    .section.active { display:block; }
  </style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2>STAFF</h2>
    <p id="gateSub">Crea sin Miedo</p>
    <input type="password" id="pwInput" placeholder="Clave de staff" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="gate-btn" onclick="checkPw()">Acceder</button>
    <div class="gate-err" id="gateErr">Clave incorrecta</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="h-logo">CREA <span>SIN</span> MIEDO · <span style="color:var(--muted);font-size:.75rem;font-family:'Inter'">Staff</span></div>
    <div class="h-date" id="hDate">Cargando…</div>
  </header>

  <div class="content">
    <div class="tabs">
      <div class="tab active" onclick="showSection('cronograma',this)">📅 Cronograma</div>
      <div class="tab" onclick="showSection('equipo',this)">👥 Equipo</div>
      <div class="tab" onclick="showSection('notas',this)">📦 Notas de producción</div>
    </div>

    <!-- CRONOGRAMA -->
    <div class="section active" id="sec-cronograma">
      <div class="timeline" id="timelinePublico"></div>
      <div style="margin:24px 0 12px;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)">— Solo staff / producción</div>
      <div class="timeline" id="timelineStaff"></div>
    </div>

    <!-- EQUIPO -->
    <div class="section" id="sec-equipo">
      <div class="staff-grid" id="staffGrid">
        <div style="color:var(--muted);font-size:.85rem;padding:20px">Cargando equipo…</div>
      </div>
    </div>

    <!-- NOTAS DE PRODUCCIÓN -->
    <div class="section" id="sec-notas">
      <div class="notas-card" id="notasProduccion">Cargando…</div>
    </div>
  </div>
</div>

<script>
let adminKey = sessionStorage.getItem('csm_admin_key');
let eventoActual = null;

function checkPw() {
  const v = document.getElementById('pwInput').value.trim();
  if (!v) return;
  fetch('/api/checkin?key=' + encodeURIComponent(v) + '&q=_test_')
    .then(r => { if (r.status === 401) throw new Error(); return r.json(); })
    .then(d => {
      if (d?.error === 'No autorizado') throw new Error();
      sessionStorage.setItem('csm_admin_key', v);
      adminKey = v;
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderAll();
    }).catch(() => { document.getElementById('gateErr').style.display = 'block'; });
}

function showSection(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function fmtFechaCorta(iso) {
  if (!iso) return '—';
  return new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    .replace(/^\w/, c => c.toUpperCase());
}

function renderTimeline(elId, items, variant) {
  document.getElementById(elId).innerHTML = items.length ? items.map(item => `
    <div class="tl-item ${item.tipo === 'break' ? 'break' : variant === 'staff' ? 'staff' : ''}">
      <div class="tl-time"><span>${esc(item.hora || '—')}</span></div>
      <div class="tl-body">
        <div class="tl-card ${item.tipo === 'break' ? 'break-card' : variant === 'staff' ? 'staff-card' : ''}">
          <h4>${esc(item.actividad)}</h4>
          ${item.notas ? `<p>${esc(item.notas)}</p>` : ''}
          <div class="tl-meta">
            ${item.responsable ? `<span class="tl-tag orange">${esc(item.responsable)}</span>` : ''}
            ${item.lugar ? `<span class="tl-tag blue">${esc(item.lugar)}</span>` : ''}
            ${variant === 'staff' && item.tipo && item.tipo !== 'staff' ? `<span class="tl-tag green">${esc(item.tipo)}</span>` : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('') : '<div style="color:var(--muted);font-size:.85rem;padding:12px 0">Sin items todavía.</div>';
}

function renderEquipo(staff) {
  document.getElementById('staffGrid').innerHTML = staff.length ? staff.map(s => `
    <div class="staff-card">
      <div class="staff-avatar">👤</div>
      <div class="staff-name">${esc(s.nombre)}</div>
      <div class="staff-rol">${esc(s.rol || '—')}</div>
      <span class="staff-area">${esc(s.area || '—')}</span>
      <div class="staff-horario">⏰ ${esc(s.horario_entrada || '—')} – ${esc(s.horario_salida || '—')}</div>
      ${Array.isArray(s.tareas) && s.tareas.length ? `
        <div class="staff-tareas">
          <h5>Responsabilidades</h5>
          ${s.tareas.map(t => `
            <div class="tarea">
              <div class="tarea-check" onclick="toggleCheck(this)"></div>
              <div class="tarea-text">${esc(t)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `).join('') : '<div style="color:var(--muted);font-size:.85rem;padding:20px">Sin crew registrado para este evento todavía.</div>';
}

function toggleCheck(el) {
  el.classList.toggle('done');
  el.closest('.tarea').classList.toggle('done');
}

async function renderAll() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || 'next';

  try {
    const evRes = await fetch(`/api/eventos?slug=${encodeURIComponent(slug)}`);
    if (!evRes.ok) throw new Error('sin evento');
    eventoActual = await evRes.json();
  } catch (e) {
    document.getElementById('hDate').textContent = 'Sin evento próximo';
    document.getElementById('gateSub').textContent = 'Crea sin Miedo';
    return;
  }

  document.getElementById('hDate').textContent = `${fmtFechaCorta(eventoActual.fecha)} · ${eventoActual.ciudad}`;
  document.getElementById('gateSub').textContent = `Crea sin Miedo · ${eventoActual.ciudad}`;

  const [cronoRes, staffRes] = await Promise.all([
    fetch(`/api/cronograma?slug=${encodeURIComponent(eventoActual.slug)}&all=1`, { headers: { 'x-admin-key': adminKey } }),
    fetch(`/api/admin-data?table=csm_staff&evento_id=${eventoActual.id}`, { headers: { 'x-admin-key': adminKey } }),
  ]);
  const crono = cronoRes.ok ? await cronoRes.json() : [];
  const staff = staffRes.ok ? await staffRes.json() : [];

  const pub = Array.isArray(crono) ? crono.filter(c => c.tipo === 'publico' || c.tipo === 'break') : [];
  const prod = Array.isArray(crono) ? crono.filter(c => c.tipo !== 'publico' && c.tipo !== 'break') : [];
  renderTimeline('timelinePublico', pub, 'publico');
  renderTimeline('timelineStaff', prod, 'staff');

  renderEquipo(Array.isArray(staff) ? staff : []);

  document.getElementById('notasProduccion').textContent =
    eventoActual.notas_produccion || 'Sin notas de producción para este evento todavía — agrégalas desde el admin.';
}

if (sessionStorage.getItem('csm_admin_key')) {
  adminKey = sessionStorage.getItem('csm_admin_key');
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAll();
}
</script>
</body>
</html>
