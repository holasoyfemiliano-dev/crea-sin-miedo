<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Cronograma — Crea sin Miedo</title>
  <meta name="description" id="pageDesc" content="Horario y ubicación del taller Crea sin Miedo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --dark:#0a0806; --card:rgba(255,255,255,.05); --border:rgba(229,39,43,.25);
      --red:#e5272b; --red2:#ef3535; --gold:#f5c518; --amber:#ff9f43;
      --white:#ffffff; --text:#d9d2c8; --muted:#b3a89c;
    }
    body {
      min-height:100vh; background:var(--dark);
      background-image:
        radial-gradient(ellipse 75% 55% at 8% 4%, rgba(229,39,43,.16) 0%, transparent 58%),
        radial-gradient(ellipse 65% 50% at 95% 12%, rgba(245,197,24,.10) 0%, transparent 60%),
        radial-gradient(ellipse 70% 55% at 50% 105%, rgba(255,159,67,.09) 0%, transparent 62%);
      color:var(--white); font-family:'Inter',sans-serif;
      display:flex; align-items:center; justify-content:center; padding:40px 20px;
    }
    .wrap { max-width:480px; width:100%; }
    .eyebrow { text-align:center; font-size:.7rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; }
    .logo { text-align:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(2.4rem,7.5vw,3.4rem); line-height:1; letter-spacing:.02em; margin-bottom:8px; text-shadow:0 0 60px rgba(229,39,43,.25); }
    .logo .red { color:var(--red); text-shadow:0 0 50px rgba(229,39,43,.65), 0 0 100px rgba(229,39,43,.3); }
    .taller-rule { width:56px; height:3px; margin:0 auto 30px; background:linear-gradient(90deg, var(--red), var(--gold)); border-radius:3px; }

    .meta { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:30px; }
    .meta-pill { border-radius:999px; padding:9px 18px; font-size:.8rem; color:var(--white); font-weight:500; }
    .meta-pill.loc { background:rgba(229,39,43,.13); border:1px solid rgba(229,39,43,.35); }
    .meta-pill.date { background:rgba(245,197,24,.13); border:1px solid rgba(245,197,24,.4); }

    .details { display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
    .detail-item {
      display:flex; gap:14px; padding:18px; border-radius:16px;
      background:linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
    }
    .detail-item.loc  { background:linear-gradient(135deg, rgba(229,39,43,.11), rgba(255,255,255,.02)); border-color:rgba(229,39,43,.28); }
    .detail-item.time { background:linear-gradient(135deg, rgba(245,197,24,.11), rgba(255,255,255,.02)); border-color:rgba(245,197,24,.3); }

    .icon-badge { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
    .icon-badge.red  { background:rgba(229,39,43,.16); border:1px solid rgba(229,39,43,.4); }
    .icon-badge.gold { background:rgba(245,197,24,.16); border:1px solid rgba(245,197,24,.45); }

    .detail-title { font-weight:700; font-size:.87rem; margin-bottom:4px; color:var(--white); }
    .detail-text { font-size:.84rem; color:var(--text); line-height:1.55; }
    .detail-text a { color:var(--gold); text-decoration:none; font-weight:600; }
    .detail-text a:hover { text-decoration:underline; }

    .timeline { margin-top:6px; display:flex; flex-direction:column; gap:8px; }
    .timeline-row { display:flex; gap:10px; align-items:flex-start; }
    .timeline-time {
      font-family:'Oswald',sans-serif; font-weight:600; font-size:.74rem; color:var(--gold);
      background:rgba(245,197,24,.13); border:1px solid rgba(245,197,24,.3); border-radius:6px;
      padding:3px 8px; white-space:nowrap; text-align:center; flex-shrink:0; margin-top:1px;
    }
    .timeline-label { font-size:.85rem; color:var(--text); line-height:1.4; }

    .btn-red {
      display:block; width:100%; text-align:center; background:linear-gradient(135deg, var(--red2), var(--red));
      color:#fff; border:none; border-radius:8px; padding:16px; font-size:.85rem; font-weight:800;
      letter-spacing:.06em; text-transform:uppercase; text-decoration:none;
      box-shadow:0 12px 30px -10px rgba(229,39,43,.55); transition:transform .15s, box-shadow .15s;
    }
    .btn-red:hover { transform:translateY(-1px); box-shadow:0 16px 34px -10px rgba(229,39,43,.7); }

    footer { text-align:center; margin-top:30px; font-size:.74rem; color:var(--muted); }
    footer .red { color:var(--red); font-weight:700; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Cronograma</div>
  <div class="logo">CREA<br><span class="red">SIN MIEDO</span></div>
  <div class="taller-rule"></div>

  <div class="meta" id="metaRow">
    <div class="meta-pill loc" id="pillLoc">📍 Cargando…</div>
    <div class="meta-pill date" id="pillDate">📅 —</div>
  </div>

  <div class="details" id="detailsWrap">
    <div class="detail-item loc">
      <div class="icon-badge red">📍</div>
      <div>
        <div class="detail-title">Así llegas</div>
        <div class="detail-text" id="addrText">Cargando ubicación…</div>
      </div>
    </div>
    <div class="detail-item time">
      <div class="icon-badge gold">🕘</div>
      <div>
        <div class="detail-title">Así va el día</div>
        <div class="timeline" id="timelineList">
          <div class="timeline-row"><span class="timeline-label" style="color:var(--muted)">Cargando horario…</span></div>
        </div>
      </div>
    </div>
  </div>

  <a href="/registro" id="registroLink" class="btn-red">Regístrate →</a>

  <footer><span class="red">Crea sin Miedo</span> · <span id="footerText">—</span></footer>
</div>

<script>
function fmtFechaLarga(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    .replace(/^\w/, c => c.toUpperCase());
}
function fmtFechaCorta(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
}
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function loadEvento() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || 'next';

  try {
    const [evRes, croRes] = await Promise.all([
      fetch(`/api/eventos?slug=${encodeURIComponent(slug)}`),
      fetch(`/api/cronograma?slug=${encodeURIComponent(slug)}`),
    ]);
    if (!evRes.ok) throw new Error('sin evento');
    const ev = await evRes.json();
    const cronograma = croRes.ok ? await croRes.json() : [];

    document.getElementById('pillLoc').textContent = `📍 ${ev.ciudad}`;
    document.getElementById('pillDate').textContent = `📅 ${fmtFechaLarga(ev.fecha)}`;
    document.getElementById('footerText').textContent = `${fmtFechaCorta(ev.fecha)} · ${ev.ciudad}`;
    document.getElementById('pageTitle').textContent = `Cronograma — Crea sin Miedo · ${ev.ciudad}`;
    document.getElementById('registroLink').href = ev.slug ? `/registro/${ev.slug}` : '/registro';

    const addr = [ev.direccion || ev.venue].filter(Boolean).join(' — ');
    const mapsUrl = ev.maps_url || (addr ? `https://maps.google.com/?q=${encodeURIComponent(addr)}` : null);
    document.getElementById('addrText').innerHTML = addr
      ? `${esc(addr)}${mapsUrl ? `<br><a href="${mapsUrl}" target="_blank" rel="noopener">Cómo llegar →</a>` : ''}`
      : 'Te avisamos la ubicación exacta por correo.';

    const timelineEl = document.getElementById('timelineList');
    timelineEl.innerHTML = cronograma.length
      ? cronograma.map(c => `<div class="timeline-row"><span class="timeline-time">${esc(c.hora || '—')}</span><span class="timeline-label">${esc(c.actividad)}</span></div>`).join('')
      : '<div class="timeline-row"><span class="timeline-label" style="color:var(--muted)">Muy pronto compartimos el horario del día.</span></div>';
  } catch (e) {
    document.getElementById('metaRow').innerHTML = '';
    document.getElementById('detailsWrap').innerHTML =
      '<div class="detail-item"><div>No hay ningún evento próximo por ahora. Vuelve pronto.</div></div>';
  }
}

loadEvento();
</script>

</body>
</html>
